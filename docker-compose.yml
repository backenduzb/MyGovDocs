version: '3.8'

services:
  web:
    build: .
    container_name: govdock_web
    command: ./entrypoint.sh
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - govdock_network

networks:
  govdock_network:
    driver: bridge
